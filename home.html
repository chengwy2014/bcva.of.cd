<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCADE COTTON · 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Work Sans', 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 深色渐变背景 + 细腻纹理 */
            background-color: #0f1f1c;
            background-image: 
                repeating-linear-gradient(45deg, rgba(122, 196, 178, 0.04) 0px, rgba(122, 196, 178, 0.04) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(122, 196, 178, 0.03) 0px, rgba(122, 196, 178, 0.03) 2px, transparent 2px, transparent 6px),
                radial-gradient(circle at 25% 20%, rgba(232, 149, 92, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 80% 78%, rgba(122, 196, 178, 0.16) 0%, transparent 50%),
                linear-gradient(160deg, #14312b 0%, #0b1a17 100%);
            color: #eef4f1;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.4) 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页按钮 */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 3rem;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            border: 2px solid transparent;
            min-width: 200px;
            backdrop-filter: blur(4px);
            /* 暖橘金实心 */
            background: linear-gradient(145deg, #e8955c, #d4733f);
            color: #0f1f1c;
            border-color: #e8955c;
            box-shadow: 
                0 8px 24px rgba(232, 149, 92, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .btn-home:hover {
            background: linear-gradient(145deg, #f7c88a, #e8955c);
            border-color: #f7c88a;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 16px 32px rgba(232, 149, 92, 0.5),
                0 0 24px rgba(232, 149, 92, 0.4);
        }

        /* 底部装饰细线 */
        .deco-line {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.7;
        }

        .deco-line span {
            display: block;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #7ac4b2, transparent);
        }

        .deco-dot {
            width: 6px;
            height: 6px;
            background: #e8955c;
            border-radius: 50%;
            box-shadow: 0 0 10px #e8955c;
        }

        @media (max-width: 600px) {
            .btn-home {
                padding: 0.9rem 2rem;
                font-size: 1.05rem;
                min-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页按钮 → http://bcva.of.cd/ -->
        <a href="http://bcva.of.cd/" class="btn-home">返回欢迎页</a>

        <!-- 底部小装饰 -->
        <div class="deco-line">
            <span></span>
            <div class="deco-dot"></div>
            <span></span>
        </div>
    </div>
</body>
</html>
