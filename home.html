<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCADE COTTON · 进入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Work Sans', 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1e1812;
            background-image: 
                repeating-linear-gradient(45deg, rgba(201, 168, 108, 0.04) 0px, rgba(201, 168, 108, 0.04) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(201, 168, 108, 0.03) 0px, rgba(201, 168, 108, 0.03) 2px, transparent 2px, transparent 6px),
                radial-gradient(circle at 30% 20%, rgba(166, 124, 78, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(201, 168, 108, 0.12) 0%, transparent 45%),
                linear-gradient(145deg, #2c241b 0%, #1a1410 100%);
            color: #f8f4eb;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.35) 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 返回首页按钮 */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 1rem 3rem;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #c9a86c;
            border: 2px solid #c9a86c;
            border-radius: 60px;
            background: rgba(201, 168, 108, 0.06);
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            backdrop-filter: blur(4px);
            min-width: 200px;
            justify-content: center;
        }

        .back-home:hover {
            background: rgba(201, 168, 108, 0.18);
            border-color: #e6cf9f;
            color: #ffffff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 16px 32px rgba(201, 168, 108, 0.3),
                0 0 24px rgba(201, 168, 108, 0.25);
        }

        /* 底部装饰细线 */
        .deco-line {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.6;
        }

        .deco-line span {
            display: block;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a86c, transparent);
        }

        .deco-dot {
            width: 6px;
            height: 6px;
            background: #c9a86c;
            border-radius: 50%;
            box-shadow: 0 0 10px #c9a86c;
        }

        @media (max-width: 600px) {
            .back-home {
                padding: 0.9rem 2rem;
                font-size: 1.05rem;
                min-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回首页按钮 → http://bcva.of.cd/ -->
        <a href="http://bcva.of.cd/" class="back-home">返回首页</a>

        <!-- 底部小装饰 -->
        <div class="deco-line">
            <span></span>
            <div class="deco-dot"></div>
            <span></span>
        </div>
    </div>
</body>
</html>
